name: Frontend CI

on: 
    push:
        branches: [ main, dev ]
    pull_request:
        branches: [ main, dev ]

jobs:
    test:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            
            - name: Install dependencies
              working-directory: ./Zevra
              run: npm install
            
            - name: Start Angular server
              working-directory: ./Zevra
              run: |
                  npx ng serve &
                  sleep 10
                  curl -f http://localhost:4200 || exit 1