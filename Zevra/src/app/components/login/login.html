<section class="login-section">
    <div class="login-wrapper">
        <div class="login-card">
            <h2 class="login-title">Connexion</h2>
            <p class="login-subtitle">Accédez à votre compte Zevra.</p>

            <form (ngSubmit)="onSubmit()" class="login-form">
                <div class="login-field">
                    <label for="email" class="login-label">Email</label>
                    <input id="email" type="email" [(ngModel)]="email" name="email" class="login-input"
                        placeholder="email@exemple.com" required />
                </div>

                <div class="login-field">
                    <label for="password" class="login-label">Mot de passe</label>
                    <input id="password" type="password" [(ngModel)]="password" name="password" class="login-input"
                        placeholder="••••••••" required />
                </div>

                @if (errorMessage) {
                <p class="login-error">{{ errorMessage }}</p>
                }

                <div class="login-actions">
                    <button type="submit" class="login-button" [disabled]="isSubmitting">
                        {{ isSubmitting ? 'Connexion...' : 'Se connecter' }}
                    </button>
                    <a routerLink="/register" class="login-link">Pas encore de compte ? S'inscrire</a>
                </div>
            </form>
        </div>
    </div>
</section>
