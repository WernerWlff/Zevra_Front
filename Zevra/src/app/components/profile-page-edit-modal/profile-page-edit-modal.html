<div class="profile-edit-modal-overlay" (click)="onOverlayClick($event)" role="presentation">
  <div class="profile-edit-modal" role="dialog" aria-labelledby="profile-edit-modal-title" aria-modal="true">
    <div class="profile-edit-modal-header">
      <h2 id="profile-edit-modal-title" class="profile-edit-modal-title">Modifier mon profil</h2>
      <button type="button" class="profile-edit-modal-close" (click)="onCancel()" aria-label="Fermer">
        x
      </button>
    </div>
    <form (ngSubmit)="onSubmit()" class="profile-edit-modal-form">
      @if (errorMessage) {
        <p class="profile-edit-modal-error">{{ errorMessage }}</p>
      }
      @if (apiError) {
        <p class="profile-edit-modal-error">{{ apiError }}</p>
      }
      <div class="profile-edit-modal-field">
        <label for="edit-firstname">Prénom</label>
        <input id="edit-firstname" type="text" [(ngModel)]="firstName" name="firstName" required />
      </div>
      <div class="profile-edit-modal-field">
        <label for="edit-lastname">Nom</label>
        <input id="edit-lastname" type="text" [(ngModel)]="lastName" name="lastName" required />
      </div>
      <div class="profile-edit-modal-field">
        <label for="edit-username">Nom d'utilisateur</label>
        <input id="edit-username" type="text" [(ngModel)]="username" name="username" required
          minlength="4" maxlength="20" />
      </div>
      <div class="profile-edit-modal-field">
        <label for="edit-email">Email</label>
        <input id="edit-email" type="email" [(ngModel)]="email" name="email" required />
      </div>
      <div class="profile-edit-modal-actions">
        <button type="button" class="profile-edit-modal-btn profile-edit-modal-btn-cancel" (click)="onCancel()">
          Annuler
        </button>
        <button type="submit" class="profile-edit-modal-btn profile-edit-modal-btn-save" [disabled]="saving">
          {{ saving ? 'Enregistrement…' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
